<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      color: #edf2f7;

      display: flex;

      justify-content: center;
      min-height: 100vh;
    }

    .box {
      text-align: center;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.02);

    }

    p {
      color: #b5c0cf;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(98,245,203,0.22);
      background: rgba(98,245,203,0.14);
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

  <div class="box">
    <h1>Request received.</h1>
